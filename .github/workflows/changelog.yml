name: Changelog

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changelog:
    uses: open-telemetry/shared-workflows/.github/workflows/chloggen.yml@0cc57aeabf2a31cf41114e7b24561f21a04e360b # v0.18.0
    with:
      # Match the Go toolchain in ci.yml and .promu.yml.
      go-version: '1.26'
